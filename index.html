<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospects to Watch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prospects">
<style>
  :root { --bg:#fff; --fg:#16181d; --muted:#6b7280; --card:#f4f5f7; --line:#e3e5e8; --accent:#1d4ed8; --star:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --fg:#e8eaed; --muted:#9aa0a6; --card:#1b1e24; --line:#2a2e36; --accent:#7aa2ff; --star:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .controls { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:8px; margin-bottom:8px; }
  select, input { width:100%; padding:8px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  .years { display:flex; gap:12px; flex-wrap:wrap; align-items:center; color:var(--muted); margin-bottom:16px; }
  .years label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  h2 { font-size:16px; margin:0 0 8px; padding-bottom:6px; border-bottom:2px solid var(--line); }
  .p { display:grid; grid-template-columns: 64px 1fr; gap:10px; align-items:center; padding:8px; background:var(--card); border-radius:8px; margin-bottom:6px; }
  .num { font-size:26px; font-weight:700; text-align:center; font-variant-numeric: tabular-nums; }
  .num.none { font-size:14px; color:var(--muted); }
  .name { font-weight:600; }
  .name a { color:inherit; text-decoration:none; }
  .name a:hover { color:var(--accent); text-decoration:underline; }
  .meta { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; font-size:12px; padding:0 6px; border-radius:4px; border:1px solid var(--line); margin-left:4px; }
  .top { color:var(--star); border-color:var(--star); }
  .empty { color:var(--muted); padding:8px 0; }
  footer { color:var(--muted); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Prospects to Watch</h1>
  <div class="controls">
    <select id="league"></select>
    <select id="teamA"></select>
    <select id="teamB"></select>
  </div>
  <div class="years" id="years"></div>
  <div class="cols">
    <section id="colA"></section>
    <section id="colB"></section>
  </div>
  <footer id="footer"></footer>
</main>

<script src="data/prospects.js"></script>
<script>
const D = window.PROSPECTS;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("ptw:" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ptw:" + k, JSON.stringify(v)); } catch {} },
};

const allPlayers = Object.values(D.leagues).flatMap(l => Object.values(l).flat());
const years = [...new Set(allPlayers.map(p => p.draft))].sort();
let activeYears = new Set(store.get("years", years));

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opt = (v, label, sel) => `<option value="${esc(v)}"${v === sel ? " selected" : ""}>${esc(label)}</option>`;

// Ligi posortowane po liczbie prospektów
const leagueNames = Object.keys(D.leagues).sort((a, b) =>
  Object.values(D.leagues[b]).flat().length - Object.values(D.leagues[a]).flat().length);

function renderLeagues() {
  const sel = store.get("league", leagueNames[0]);
  $("league").innerHTML = leagueNames.map(l =>
    opt(l, `${l} (${Object.values(D.leagues[l]).flat().length})`, sel)).join("");
}

function renderTeams() {
  const teams = Object.keys(D.leagues[$("league").value] || {}).sort();
  const saved = store.get("teams:" + $("league").value, []);
  for (const [i, id] of [[0, "teamA"], [1, "teamB"]]) {
    const sel = saved[i] ?? "";
    $(id).innerHTML = opt("", i ? "— drużyna 2 —" : "— drużyna 1 —", sel) +
      teams.map(t => opt(t, `${t} (${D.leagues[$("league").value][t].length})`, sel)).join("");
  }
}

function renderYears() {
  $("years").innerHTML = "Draft: " + years.map(y =>
    `<label><input type="checkbox" value="${y}"${activeYears.has(y) ? " checked" : ""}> ${y}</label>`).join("");
}

function playerCard(p) {
  const top = p.tier.toLowerCase().startsWith("top");
  return `<div class="p">
    <div class="num${p.number ? "" : " none"}">${p.number ? "#" + esc(p.number) : "?"}</div>
    <div>
      <div class="name"><a href="${esc(p.ep_url)}" target="_blank" rel="noopener">${esc(p.name)}</a>
        <span class="tag">${p.draft}</span>${top ? '<span class="tag top">★ Top</span>' : ""}${p.rank ? `<span class="tag">#${p.rank}</span>` : ""}</div>
      <div class="meta">${esc(p.pos)} · ${esc(p.nation)}</div>
    </div>
  </div>`;
}

function renderCol(el, team) {
  if (!team) { el.innerHTML = ""; return; }
  const players = (D.leagues[$("league").value][team] || [])
    .filter(p => activeYears.has(p.draft))
    .sort((a, b) => (parseInt(a.number) || 999) - (parseInt(b.number) || 999));
  el.innerHTML = `<h2>${esc(team)}</h2>` +
    (players.length ? players.map(playerCard).join("") : `<div class="empty">Brak prospektów z wybranych roczników.</div>`);
}

function render() {
  renderCol($("colA"), $("teamA").value);
  renderCol($("colB"), $("teamB").value);
}

$("league").onchange = () => { store.set("league", $("league").value); renderTeams(); render(); };
for (const id of ["teamA", "teamB"]) $(id).onchange = () => {
  store.set("teams:" + $("league").value, [$("teamA").value, $("teamB").value]); render();
};
$("years").onchange = e => {
  const y = +e.target.value;
  e.target.checked ? activeYears.add(y) : activeYears.delete(y);
  store.set("years", [...activeYears]); render();
};

renderLeagues(); renderTeams(); renderYears(); render();
$("footer").textContent = `Dane: EliteProspects Draft Center + składy lig · aktualizacja ${new Date(D.updated).toLocaleString("pl-PL")}`;
</script>
</body>
</html>
